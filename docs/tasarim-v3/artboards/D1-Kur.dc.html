<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Defter · Kur kipi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1557c0}a:hover{color:#0f3f8c}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.dots{background-color:#fbfbf9;background-image:radial-gradient(#d3d7dc 1px,transparent 1.2px);background-size:20px 20px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1d2733; background: #ffffff">

  <header style="height: 60px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid #dde1e6">
    <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#1d2733"></rect><path d="M6 15c2.5-7 5-7 8 0s5.5 7 8 0" fill="none" stroke="#f05a28" stroke-width="2.4" stroke-linecap="round"></path></svg>
    <button style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">Yeni devre<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"></path></svg></button>
    <button style="height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500">Örnekler</button>
    <div style="flex: 1"></div>
    <span style="font-size: 12px; color: #5f6b7a; padding-right: 6px">Kaydedildi</span>
    <button aria-label="Geri al" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4"></path><path d="M3 8h9a4.5 4.5 0 0 1 0 9H8"></path></svg></button>
    <button aria-label="İleri al" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #9aa3ad"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l4 4-4 4"></path><path d="M17 8H8a4.5 4.5 0 0 0 0 9h4"></path></svg></button>
    <button aria-label="Yardım" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"></circle><path d="M7.8 7.8a2.3 2.3 0 0 1 4.4.9c0 1.6-2.2 1.9-2.2 3.3"></path><path d="M10 14.6v.1"></path></svg></button>
    <button aria-label="Ayarlar" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"></path><circle cx="13" cy="6" r="2"></circle><circle cx="7" cy="14" r="2"></circle></svg></button>
    <div style="width: 1px; height: 28px; background: #dde1e6; margin: 0 6px"></div>
    <button style="height: 42px; padding: 0 18px 0 14px; border-radius: 10px; background: #1b7d44; color: #ffffff; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"></path></svg>Oynat</button>
  </header>

  <div style="flex: 1; display: flex; min-height: 0">
    <!-- Şema -->
    <main class="dots" style="flex: 1; position: relative; overflow: hidden">
      <svg width="600" height="380" viewBox="0 0 520 330" style="position: absolute; left: 160px; top: 170px" role="img" aria-label="Kurulmakta olan devre: R1'in ucundan LED1'in anoduna kablo çekiliyor">
        <g fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M80 152V60h80"></path>
          <path d="M80 168v112h360v-80"></path>
        </g>
        <path d="M250 60h190v80" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round"></path>
        <g fill="none" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M58 152h44"></path><path d="M68 168h24" stroke-width="5"></path>
          <path d="M160 60h10l5-12 10 24 10-24 10 24 10-24 10 24 10-24 5 12h10"></path>
          <path d="M440 150v0"></path>
          <path d="M424 150h32l-16 32z" fill="#fdecea"></path><path d="M424 182h32"></path><path d="M440 182v18"></path>
        </g>
        <circle cx="250" cy="60" r="5" fill="#1f6feb"></circle>
        <circle cx="440" cy="148" r="11" fill="#e6effd" stroke="#1f6feb" stroke-width="2"></circle>
        <circle cx="440" cy="148" r="3.5" fill="#1f6feb"></circle>
        <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#1d2733">
          <text x="30" y="160" font-weight="600">B1</text><text x="30" y="178" fill="#5f6b7a">5 V</text>
          <text x="188" y="108" font-weight="600">R1</text><text x="214" y="108" fill="#5f6b7a">330 Ω</text>
          <text x="470" y="172" font-weight="600">LED1</text>
        </g>
        <rect x="456" y="118" width="58" height="22" rx="5" fill="#1f6feb"></rect>
        <text x="463" y="133" font-family="IBM Plex Mono, monospace" font-size="12" fill="#ffffff">anot +</text>
      </svg>
      <div style="position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px; font-size: 13px; color: #3d4957">
        Uca bırak: bağla
        <span style="color: #c4cad2">·</span>
        <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; border: 1px solid #dde1e6; border-radius: 4px; padding: 1px 5px">Esc</kbd> vazgeç
      </div>
      <div style="position: absolute; right: 16px; bottom: 16px; display: flex; align-items: center; padding: 3px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px">
        <button aria-label="Uzaklaştır" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12"></path></svg></button>
        <button aria-label="Yakınlaştır" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12M10 4v12"></path></svg></button>
        <button aria-label="Sığdır" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"></path></svg></button>
        <button style="height: 36px; padding: 0 10px; font-size: 13px; font-weight: 500; border-left: 1px solid #dde1e6">3B</button>
      </div>
    </main>

    <!-- Defter -->
    <aside style="width: 500px; flex: none; display: flex; flex-direction: column; gap: 10px; padding: 16px; box-sizing: border-box; background: #f4f5f7; border-left: 1px solid #dde1e6; overflow: hidden">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px 2px">
        <span style="font-size: 17px; font-weight: 600">Devredeki parçalar</span>
        <span style="font-size: 13px; color: #5f6b7a">3 parça</span>
      </div>

      <button style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 0 14px; height: 60px; flex: none; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg width="34" height="18" viewBox="0 0 30 16" fill="none" stroke="#1d2733" stroke-width="1.5" aria-hidden="true"><path d="M0 8h12M18 8h12"></path><path d="M12 1v14"></path><path d="M18 4.5v7" stroke-width="3"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">B1 <span style="font-weight: 400; color: #5f6b7a">· Pil</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">5 V</span>
      </button>
      <button style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 0 14px; height: 60px; flex: none; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg width="34" height="18" viewBox="0 0 30 16" fill="none" stroke="#1d2733" stroke-width="1.5" aria-hidden="true"><path d="M0 8h6l2-5 3 10 3-10 3 10 3-10 2 5h8"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">R1 <span style="font-weight: 400; color: #5f6b7a">· Direnç</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">330 Ω</span>
      </button>
      <button style="background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 0 14px; height: 60px; flex: none; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg width="34" height="18" viewBox="0 0 30 16" fill="none" stroke="#1d2733" stroke-width="1.5" aria-hidden="true"><path d="M0 8h10M20 8h10"></path><path d="M10 3l10 5-10 5z"></path><path d="M20 3v10"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">LED1 <span style="font-weight: 400; color: #5f6b7a">· LED</span></span>
        <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #fef6e7; border: 1px dashed #b54708; color: #8a3a06; font-size: 12px; font-weight: 600; display: flex; align-items: center">1 uç boşta</span>
        <span style="font-size: 14px; color: #3d4957">Kırmızı</span>
      </button>

      <!-- Parça ekleme: arama satırı açık -->
      <div style="flex: none; background: #ffffff; border: 2px solid #1f6feb; border-radius: 12px; overflow: hidden">
        <label style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #dde1e6">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#1f6feb" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12M10 4v12"></path></svg>
          <input value="kond" aria-label="Parça ekle" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px">
          <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5f6b7a; border: 1px solid #dde1e6; border-radius: 4px; padding: 1px 5px">Enter</kbd>
        </label>
        <button style="width: 100%; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #e6effd; text-align: left">
          <svg width="34" height="18" viewBox="0 0 30 16" fill="none" stroke="#1d2733" stroke-width="1.5" aria-hidden="true"><path d="M0 8h13M17 8h13M13 2v12M17 2v12"></path></svg>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Kondansatör</span><span style="font-size: 12px; color: #3d4957">Pasif</span></span>
          <span style="font-size: 12px; color: #1557c0">Şemada boş yere eklenir</span>
        </button>
        <span style="display: block; padding: 10px 14px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5f6b7a">Örnekler</span>
        <button style="width: 100%; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 14px; text-align: left">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h5a2 2 0 0 1 2 2V16a1.5 1.5 0 0 0-1.5-1.5H3z"></path><path d="M17 4.5h-5a2 2 0 0 0-2 2V16a1.5 1.5 0 0 1 1.5-1.5H17z"></path></svg>RC dolma
        </button>
        <button style="width: 100%; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 14px 4px; font-size: 14px; text-align: left">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h5a2 2 0 0 1 2 2V16a1.5 1.5 0 0 0-1.5-1.5H3z"></path><path d="M17 4.5h-5a2 2 0 0 0-2 2V16a1.5 1.5 0 0 1 1.5-1.5H17z"></path></svg>Kare dalga ile RC
        </button>
      </div>
      <button style="flex: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 13px; color: #1557c0">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"></rect><rect x="11" y="3" width="6" height="6" rx="1"></rect><rect x="3" y="11" width="6" height="6" rx="1"></rect><rect x="11" y="11" width="6" height="6" rx="1"></rect></svg>Bütün parçalara göz at (35)
      </button>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
