<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Baraj · ders görünümü</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1557c0}a:hover{color:#0f3f8c}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1d2733; background: #ffffff">

  <header style="height: 56px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px; border-bottom: 1px solid #dde1e6">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="#" style="height: 40px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; color: #1d2733; text-decoration: none; font-size: 14px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l-6 6 6 6"></path></svg>Simülatör</a>
      <div style="width: 1px; height: 24px; background: #dde1e6; margin: 0 6px"></div>
      <span style="font-size: 16px; font-weight: 600">Baraj su seviyesi uyarısı</span>
    </div>
    <div style="display: flex; padding: 3px; background: #f0f2f5; border-radius: 10px">
      <button aria-pressed="true" style="height: 36px; padding: 0 16px; border-radius: 8px; background: #ffffff; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(29,39,51,0.12)">Çubuk gösterge</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 16px; border-radius: 8px; font-size: 14px; color: #3d4957">Tek ışık</button>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 6px">
      <button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #dde1e6; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1.5"></rect><path d="M6 13l3-4 2 2 3-4"></path></svg>Devre</button>
      <button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #dde1e6; font-size: 14px; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"></circle><path d="M7.8 7.8a2.3 2.3 0 0 1 4.4.9c0 1.6-2.2 1.9-2.2 3.3"></path><path d="M10 14.6v.1"></path></svg>Soru</button>
      <button aria-label="Diğer: Ayarlar, Başa al, Tam ekran, Simülatörde aç" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.7" fill="currentColor"></circle><circle cx="10" cy="10" r="1.7" fill="currentColor"></circle><circle cx="16" cy="10" r="1.7" fill="currentColor"></circle></svg></button>
    </div>
  </header>

  <!-- Sahne -->
  <main style="flex: 1; position: relative; overflow: hidden">
    <svg width="1440" height="740" viewBox="0 0 1440 740" style="position: absolute; inset: 0" role="img" aria-label="Baraj kesiti: su yüzde 50; Seviye 1 probu ıslak, yeşil lamba yanıyor; sarı ve kırmızı sönük">
      <defs>
        <linearGradient id="su" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74b6ec"></stop><stop offset="1" stop-color="#3a7fc0"></stop></linearGradient>
        <radialGradient id="yesil"><stop offset="0" stop-color="#34d27a" stop-opacity="0.55"></stop><stop offset="1" stop-color="#34d27a" stop-opacity="0"></stop></radialGradient>
      </defs>
      <rect width="1440" height="740" fill="#eaf1f6"></rect>
      <polygon points="0,440 180,270 330,380 520,230 760,440" fill="#d6e0e8"></polygon>
      <polygon points="760,460 920,280 1080,390 1250,240 1440,370 1440,640 760,640" fill="#dde6ed"></polygon>
      <rect x="0" y="640" width="1440" height="100" fill="#a8977c"></rect>
      <rect x="0" y="640" width="1440" height="10" fill="#8f7e64"></rect>
      <polygon points="830,630 1440,612 1440,642 830,642" fill="#74b6ec"></polygon>

      <!-- Hazne -->
      <path d="M0 440Q20 433 40 440T80 440T120 440T160 440T200 440T240 440T280 440T320 440T360 440T400 440T440 440T480 440T520 440T560 440T600 440T640 440V640H0Z" fill="url(#su)"></path>
      <g stroke="#1d2733" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="8 8"><path d="M30 490H580M30 390H580M30 290H580"></path></g>

      <!-- Baraj gövdesi -->
      <polygon points="640,190 700,190 830,640 640,640" fill="#cfd4db" stroke="#aab1ba" stroke-width="2"></polygon>
      <path d="M672 200V622" stroke="#8a939c" stroke-width="3"></path>
      <rect x="646" y="150" width="48" height="40" fill="#f3f4f6" stroke="#8a939c" stroke-width="2"></rect>
      <polygon points="638,152 670,126 702,152" fill="#c0504d"></polygon>
      <path d="M694 166H1040" stroke="#3d4957" stroke-width="3"></path>

      <!-- Problar -->
      <g stroke="#3d4957" stroke-width="5" stroke-linecap="round"><path d="M598 290H672M598 390H672M598 490H672M598 620H672"></path></g>
      <circle cx="590" cy="290" r="9" fill="#ffffff" stroke="#3d4957" stroke-width="3"></circle>
      <circle cx="590" cy="390" r="9" fill="#ffffff" stroke="#3d4957" stroke-width="3"></circle>
      <circle cx="590" cy="490" r="16" fill="#34d27a" fill-opacity="0.35"></circle>
      <circle cx="590" cy="490" r="9" fill="#1b7d44" stroke="#ffffff" stroke-width="3"></circle>
      <circle cx="590" cy="620" r="9" fill="#1d2733" stroke="#ffffff" stroke-width="3"></circle>
      <g font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
        <circle cx="722" cy="290" r="20" fill="#d92d20"></circle><text x="722" y="297" fill="#ffffff">3</text>
        <circle cx="740" cy="390" r="20" fill="#e8b10f"></circle><text x="740" y="397" fill="#1d2733">2</text>
        <circle cx="764" cy="490" r="20" fill="#1b7d44"></circle><text x="764" y="497" fill="#ffffff">1</text>
      </g>
      <rect x="690" y="602" width="128" height="34" rx="8" fill="#ffffff" stroke="#aab1ba"></rect>
      <text x="704" y="625" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="600" fill="#1d2733">Ortak +9 V</text>

      <!-- Işık kulesi -->
      <rect x="1092" y="450" width="20" height="192" fill="#3d4957"></rect>
      <circle cx="1102" cy="380" r="90" fill="url(#yesil)"></circle>
      <rect x="1040" y="120" width="124" height="330" rx="20" fill="#1d2733"></rect>
      <g font-family="IBM Plex Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
        <circle cx="1102" cy="190" r="38" fill="#2a333d" stroke="#d92d20" stroke-width="4" stroke-opacity="0.6"></circle><text x="1102" y="199" fill="#d92d20" fill-opacity="0.7">3</text>
        <circle cx="1102" cy="285" r="38" fill="#2a333d" stroke="#e8b10f" stroke-width="4" stroke-opacity="0.6"></circle><text x="1102" y="294" fill="#e8b10f" fill-opacity="0.7">2</text>
        <circle cx="1102" cy="380" r="38" fill="#34d27a" stroke="#1b7d44" stroke-width="4"></circle><text x="1102" y="389" fill="#0e3d22">1</text>
      </g>

      <!-- Su seviyesi tutamağı -->
      <rect x="370" y="418" width="132" height="44" rx="22" fill="#ffffff" stroke="#1f6feb" stroke-width="2"></rect>
      <path d="M392 432l6-6 6 6M392 448l6 6 6-6" fill="none" stroke="#1557c0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <text x="418" y="448" font-family="IBM Plex Mono, monospace" font-size="21" font-weight="600" fill="#1557c0">%50</text>
    </svg>

    <!-- Tek cümle: durum -->
    <div role="status" style="position: absolute; left: 24px; top: 24px; display: flex; align-items: center; gap: 16px; padding: 16px 24px 16px 18px; background: #ffffff; border: 2px solid #b9dfc8; border-radius: 16px; box-shadow: 0 6px 20px rgba(29,39,51,0.08)">
      <span style="width: 22px; height: 22px; border-radius: 11px; background: #1b7d44; box-shadow: 0 0 0 6px #e8f5ed"></span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 30px; font-weight: 700; line-height: 1.1">Normal</span>
        <span style="font-size: 16px; color: #3d4957">Su Seviye 1'e ulaştı.</span>
      </span>
    </div>

    <!-- İsteğe bağlı katmanlar -->
    <div style="position: absolute; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 8px">
      <span style="font-size: 13px; color: #1d2733; font-weight: 600">Göster:</span>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.92); font-size: 13px">İyonlar</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,0.92); font-size: 13px">Yüzde ölçeği</button>
    </div>
  </main>

  <!-- Kumanda: tek satır -->
  <footer style="height: 104px; flex: none; display: flex; align-items: center; gap: 40px; padding: 0 24px; border-top: 1px solid #dde1e6; background: #ffffff">
    <div role="group" aria-label="Su akışı" style="display: flex; padding: 4px; gap: 4px; background: #f0f2f5; border-radius: 14px">
      <button style="height: 56px; width: 124px; border-radius: 11px; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14l-7 10z" fill="currentColor"></path></svg>Boşalt</button>
      <button aria-pressed="true" style="height: 56px; width: 124px; border-radius: 11px; background: #ffffff; font-size: 16px; font-weight: 600; box-shadow: 0 1px 3px rgba(29,39,51,0.15); display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="12" height="12" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2" fill="currentColor"></rect></svg>Durdur</button>
      <button style="height: 56px; width: 124px; border-radius: 11px; font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14h14L10 4z" fill="currentColor"></path></svg>Doldur</button>
    </div>

    <div style="flex: 1; position: relative; height: 80px">
      <div style="position: absolute; left: 0; right: 0; top: 18px; height: 10px; border-radius: 5px; background: #dde1e6"></div>
      <div style="position: absolute; left: 0; width: 50%; top: 18px; height: 10px; border-radius: 5px; background: #3a7fc0"></div>
      <div style="position: absolute; left: 37.5%; top: 14px; width: 2px; height: 18px; background: #1b7d44"></div>
      <div style="position: absolute; left: 62.5%; top: 14px; width: 2px; height: 18px; background: #e8b10f"></div>
      <div style="position: absolute; left: 87.5%; top: 14px; width: 2px; height: 18px; background: #d92d20"></div>
      <div role="slider" aria-label="Su seviyesi" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" tabindex="0" style="position: absolute; left: calc(50% - 14px); top: 9px; width: 28px; height: 28px; border-radius: 14px; background: #ffffff; border: 3px solid #1f6feb; box-sizing: border-box; box-shadow: 0 2px 6px rgba(29,39,51,0.2)"></div>
      <button style="position: absolute; left: 0; top: 44px; height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #dde1e6; font-size: 13px; transform: translateX(-10px)">Kuru</button>
      <button style="position: absolute; left: 37.5%; top: 44px; height: 32px; padding: 0 10px 0 6px; border-radius: 16px; border: 1px solid #b9dfc8; background: #e8f5ed; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; transform: translateX(-50%)"><span style="width: 20px; height: 20px; border-radius: 10px; background: #1b7d44; color: #ffffff; font-size: 12px; display: flex; align-items: center; justify-content: center">1</span>%37,5</button>
      <button style="position: absolute; left: 62.5%; top: 44px; height: 32px; padding: 0 10px 0 6px; border-radius: 16px; border: 1px solid #dde1e6; font-size: 13px; display: flex; align-items: center; gap: 6px; transform: translateX(-50%)"><span style="width: 20px; height: 20px; border-radius: 10px; background: #e8b10f; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>%62,5</button>
      <button style="position: absolute; left: 87.5%; top: 44px; height: 32px; padding: 0 10px 0 6px; border-radius: 16px; border: 1px solid #dde1e6; font-size: 13px; display: flex; align-items: center; gap: 6px; transform: translateX(-50%)"><span style="width: 20px; height: 20px; border-radius: 10px; background: #d92d20; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>%87,5</button>
    </div>

    <div style="width: 140px; display: flex; flex-direction: column; align-items: flex-end">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 600; line-height: 1">%50</span>
      <span style="font-size: 14px; color: #5f6b7a">sabit</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</body>
</html>
