<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Defter · Arduino</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1557c0}a:hover{color:#0f3f8c}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.dots{background-color:#fbfbf9;background-image:radial-gradient(#d3d7dc 1px,transparent 1.2px);background-size:20px 20px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1d2733; background: #ffffff">

  <header style="height: 60px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid #dde1e6">
    <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#1d2733"></rect><path d="M6 15c2.5-7 5-7 8 0s5.5 7 8 0" fill="none" stroke="#f05a28" stroke-width="2.4" stroke-linecap="round"></path></svg>
    <button style="height: 40px; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">Arduino: termometre (NTC)<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"></path></svg></button>
    <button style="height: 40px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 500">Örnekler</button>
    <div style="flex: 1"></div>
    <button aria-label="Geri al" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4"></path><path d="M3 8h9a4.5 4.5 0 0 1 0 9H8"></path></svg></button>
    <button aria-label="Yardım" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"></circle><path d="M7.8 7.8a2.3 2.3 0 0 1 4.4.9c0 1.6-2.2 1.9-2.2 3.3"></path><path d="M10 14.6v.1"></path></svg></button>
    <button aria-label="Ayarlar" style="width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"></path><circle cx="13" cy="6" r="2"></circle><circle cx="7" cy="14" r="2"></circle></svg></button>
    <div style="width: 1px; height: 28px; background: #dde1e6; margin: 0 6px"></div>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; padding-right: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1b7d44"></span><span style="font-family: 'IBM Plex Mono', monospace">6,512 s</span></span>
    <button style="height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #dde1e6; font-size: 13px">Hız <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">×1</span></button>
    <button style="height: 42px; padding: 0 16px 0 12px; border-radius: 10px; background: #1d2733; color: #ffffff; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12" fill="currentColor"></rect><rect x="11.5" y="4" width="3.5" height="12" fill="currentColor"></rect></svg>Duraklat</button>
    <button aria-label="Durdur" style="width: 42px; height: 42px; border-radius: 10px; border: 1px solid #c4cad2; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="1.5" fill="currentColor"></rect></svg></button>
  </header>

  <div style="flex: 1; display: flex; min-height: 0">
    <main class="dots" style="flex: 1; position: relative; overflow: hidden">
      <svg width="728" height="476" viewBox="0 0 520 340" style="position: absolute; left: 100px; top: 150px" role="img" aria-label="Arduino Uno; 5V'tan R1 ve NTC1'den oluşan gerilim bölücü, orta noktası A0'a bağlı; Arduino vurgulu">
        <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M280 50H120v12" stroke="#c93c2c"></path>
          <path d="M120 108v52M120 130h160" stroke="#d98a1c"></path>
          <path d="M120 206v36" stroke="#2f8a4c"></path>
          <path d="M280 90h-30v12" stroke="#2f8a4c"></path>
        </g>
        <circle cx="120" cy="130" r="3.5" fill="#d98a1c"></circle>
        <rect x="292" y="12" width="166" height="316" rx="8" fill="#e6effd" stroke="#1f6feb" stroke-width="1.4"></rect>
        <g fill="none" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
          <rect x="110" y="62" width="20" height="46" fill="#ffffff"></rect>
          <rect x="110" y="160" width="20" height="46" fill="#ffffff"></rect>
          <path d="M100 214l40-60M134 154h6v6" stroke-width="1.4"></path>
          <path d="M108 242h24M112 248h16M116 254h8"></path>
          <path d="M238 102h24M242 108h16M246 114h8"></path>
          <rect x="300" y="20" width="150" height="300" rx="6" fill="#ffffff" stroke-width="2"></rect>
          <path d="M280 50h20M280 70h20M280 90h20M280 130h20M280 150h20M280 170h20M280 190h20M280 210h20M280 230h20"></path>
          <path d="M450 50h20M450 70h20M450 90h20M450 110h20M450 130h20M450 150h20M450 170h20M450 190h20M450 210h20M450 230h20M450 250h20M450 270h20M450 290h20"></path>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="9" fill="#3d4957">
          <text x="306" y="53">5V</text><text x="306" y="73">3V3</text><text x="306" y="93">GND</text>
          <text x="306" y="133">A0</text><text x="306" y="153">A1</text><text x="306" y="173">A2</text><text x="306" y="193">A3</text><text x="306" y="213">A4</text><text x="306" y="233">A5</text>
          <text x="444" y="53" text-anchor="end">GND</text><text x="444" y="73" text-anchor="end">D13</text><text x="444" y="93" text-anchor="end">D12</text><text x="444" y="113" text-anchor="end">~D11</text><text x="444" y="133" text-anchor="end">~D10</text><text x="444" y="153" text-anchor="end">~D9</text><text x="444" y="173" text-anchor="end">D8</text><text x="444" y="193" text-anchor="end">D7</text><text x="444" y="213" text-anchor="end">~D6</text><text x="444" y="233" text-anchor="end">~D5</text><text x="444" y="253" text-anchor="end">D4</text><text x="444" y="273" text-anchor="end">~D3</text><text x="444" y="293" text-anchor="end">D2</text>
        </g>
        <g font-family="IBM Plex Sans, sans-serif" text-anchor="middle" fill="#1d2733">
          <text x="375" y="160" font-size="12" font-weight="700" letter-spacing="1">ARDUINO</text>
          <text x="375" y="175" font-size="9" fill="#5f6b7a" letter-spacing="1">UNO</text>
        </g>
        <rect x="356" y="196" width="12" height="7" rx="1.5" fill="#ffffff" stroke="#3d4957"></rect>
        <rect x="356" y="210" width="12" height="7" rx="1.5" fill="#f5a524" stroke="#8a5a00"></rect>
        <g font-family="IBM Plex Mono, monospace" font-size="8" fill="#3d4957"><text x="374" y="203">L</text><text x="374" y="217">TX</text></g>
        <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#1d2733">
          <text x="40" y="82" font-weight="600">R1</text><text x="40" y="96" fill="#5f6b7a">10 kΩ</text>
          <text x="40" y="180" font-weight="600">NTC1</text><text x="40" y="194" fill="#5f6b7a">10 kΩ</text>
          <text x="375" y="338" text-anchor="middle" font-weight="600" fill="#1557c0">ARD1</text>
        </g>
      </svg>
      <div style="position: absolute; right: 16px; bottom: 16px; display: flex; align-items: center; padding: 3px; background: #ffffff; border: 1px solid #dde1e6; border-radius: 10px">
        <button aria-label="Uzaklaştır" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12"></path></svg></button>
        <button aria-label="Yakınlaştır" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 10h12M10 4v12"></path></svg></button>
        <button aria-label="Sığdır" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"></path></svg></button>
        <button style="height: 36px; padding: 0 10px; font-size: 13px; font-weight: 500; border-left: 1px solid #dde1e6">3B</button>
      </div>
    </main>

    <aside style="width: 500px; flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; box-sizing: border-box; background: #f4f5f7; border-left: 1px solid #dde1e6; overflow: hidden">
      <button style="flex: none; background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1557c0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h5a2 2 0 0 1 2 2V16a1.5 1.5 0 0 0-1.5-1.5H3z"></path><path d="M17 4.5h-5a2 2 0 0 0-2 2V16a1.5 1.5 0 0 1 1.5-1.5H17z"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #1557c0; font-weight: 600">Örnek · Arduino</span><span style="font-size: 14px; font-weight: 600">NTC'nin sıcaklığını değiştir, Seri ekranı izle</span></span>
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"></path></svg>
      </button>

      <!-- Arduino kartı: açık -->
      <div style="flex: none; background: #ffffff; border: 2px solid #1f6feb; border-radius: 12px; padding: 12px 14px 6px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="30" height="16" viewBox="0 0 30 16" fill="none" stroke="#1557c0" stroke-width="1.5" aria-hidden="true"><rect x="6" y="1" width="18" height="14" rx="2"></rect><path d="M2 4h4M2 8h4M2 12h4M24 4h4M24 8h4M24 12h4"></path></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 600">ARD1 <span style="font-weight: 400; color: #5f6b7a">· Arduino Uno</span></span>
          <button aria-label="Kartı küçült" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5-5 5 5"></path></svg></button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-size: 13px; font-weight: 600; width: 64px">Program</span>
          <button style="flex: 1; height: 40px; border: 1px solid #c4cad2; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 14px">Termometre (NTC)<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <span style="padding: 8px 10px; border-radius: 8px; background: #f6f7f9; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5f6b7a">5V · Besleme</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">5,00 V · 0,25 mA</span></span>
          <span style="padding: 8px 10px; border-radius: 8px; background: #f6f7f9; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5f6b7a">A0 · Giriş</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">2,50 V</span></span>
          <button style="padding: 8px 10px; border-radius: 8px; border: 1px dashed #c4cad2; display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-size: 11px; color: #5f6b7a">Diğer pinler</span><span style="font-size: 13px; color: #1557c0; font-weight: 500">20 pin ›</span></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 13px; font-weight: 600">Seri ekran <span style="font-weight: 400; font-size: 11px; color: #5f6b7a">9600 baud</span></span>
            <button style="font-size: 12px; color: #1557c0; height: 28px">Temizle</button>
          </div>
          <div style="height: 128px; border-radius: 8px; background: #10161d; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #c9d1da; overflow: hidden">
            <span style="color: #7d8894">NTC: 10.00 kΩ   Sıcaklık: 25.0 °C</span>
            <span style="color: #9aa5b1">NTC: 10.00 kΩ   Sıcaklık: 25.0 °C</span>
            <span>NTC: 10.00 kΩ   Sıcaklık: 25.0 °C</span>
            <span>NTC: 10.00 kΩ   Sıcaklık: 25.0 °C</span>
            <span style="color: #ffffff">NTC: 10.00 kΩ   Sıcaklık: 25.0 °C</span>
          </div>
        </div>
        <button style="height: 40px; border-top: 1px solid #dde1e6; display: flex; align-items: center; justify-content: space-between; font-size: 13px; text-align: left">
          <span><span style="font-weight: 600">Kod</span> <span style="color: #5f6b7a">· salt okunur, önceden derlendi</span></span>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l5 5-5 5"></path></svg>
        </button>
      </div>

      <!-- NTC: çalışırken değiştirilen tek ayar karta gömülü -->
      <div style="flex: none; background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg width="30" height="16" viewBox="0 0 30 16" fill="none" stroke="#1d2733" stroke-width="1.5" aria-hidden="true"><path d="M0 8h7M23 8h7"></path><rect x="7" y="4" width="16" height="8"></rect><path d="M5 15L25 1"></path></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 600">NTC1 <span style="font-weight: 400; color: #5f6b7a">· NTC termistör</span></span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">10,0 kΩ</span>
        </div>
        <label style="display: flex; align-items: center; gap: 12px">
          <span style="font-size: 13px; width: 64px">Sıcaklık</span>
          <input type="range" min="-20" max="100" value="25" style="flex: 1; accent-color: #1f6feb">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; width: 54px; text-align: right">25 °C</span>
        </label>
      </div>

      <button style="flex: none; background: #ffffff; border: 1px solid #dde1e6; border-radius: 12px; padding: 0 14px; height: 56px; display: flex; align-items: center; gap: 12px; text-align: left">
        <svg width="30" height="16" viewBox="0 0 30 16" fill="none" stroke="#1d2733" stroke-width="1.5" aria-hidden="true"><path d="M0 8h6l2-5 3 10 3-10 3 10 3-10 2 5h8"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">R1 <span style="font-weight: 400; color: #5f6b7a">· Direnç 10 kΩ</span></span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">2,50 V</span>
      </button>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
