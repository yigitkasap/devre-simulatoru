body{margin:0}
.ui{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:14px;line-height:1.45}

.ib{width:44px;padding:0}
.seg{display:flex;background:#e4e8ec;border-radius:10px;padding:3px;gap:3px;box-sizing:border-box}
.seg button{flex:1;border:0;border-radius:7px;background:transparent;font:600 14px 'IBM Plex Sans',sans-serif;color:#3a4654;padding:0 12px;white-space:nowrap;cursor:pointer}
.seg .on{background:#fff;color:#1d2733;box-shadow:0 1px 2px rgba(29,39,51,.18),0 0 0 1px rgba(29,39,51,.06)}
.flow{display:flex;gap:6px}
.flow button{box-sizing:border-box;border:1px solid #c4cad2;border-radius:10px;background:#fff;font:600 15px 'IBM Plex Sans',sans-serif;color:#1d2733;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;padding:0 10px}
.flow .on{background:#2f7fc4;border-color:#2f7fc4;color:#fff}
.stops{display:flex;gap:6px}
.stops button{flex:1;box-sizing:border-box;border:1px solid #c4cad2;border-radius:8px;background:#fff;font:500 14px 'IBM Plex Sans',sans-serif;color:#1d2733;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;padding:0 6px}
.stops .cur{background:#e6effd;border-color:#1f6feb;color:#1557c0;font-weight:600}
.kbd{font:500 11px 'IBM Plex Mono',monospace;line-height:16px;padding:0 4px;border:1px solid currentColor;border-radius:4px;opacity:.65}
.lbl{font-size:12px;font-weight:600;color:#5f6b7a;letter-spacing:.01em}
.s{fill:none;stroke:#1d2733;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb{font:600 12px 'IBM Plex Sans',sans-serif;fill:#1d2733}
.lv{font:400 11px 'IBM Plex Mono',monospace;fill:#5f6b7a}
.rg{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font:600 12.5px 'IBM Plex Sans',sans-serif;border:1px solid transparent;box-sizing:border-box;white-space:nowrap}
.rg-doyum{background:#1d2733;color:#fff}
.rg-aktif{background:#e6effd;color:#1557c0;border-color:#9dbcf2}
.rg-kesim{background:#fff;color:#5f6b7a;border-color:#c4cad2}

.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid #dde1e6;flex:none;background:#fff}
.tabs button{height:44px;border:0;background:transparent;padding:0 14px;font:600 15px 'IBM Plex Sans',sans-serif;color:#5f6b7a;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs .on{color:#1d2733;border-bottom-color:#1f6feb}
.stp{display:flex;align-items:center;background:#fff;border:1px solid #b9c0c9;border-radius:10px;height:48px;overflow:hidden}
.stp button{width:48px;height:48px;border:0;background:#f3f5f7;font:600 20px 'IBM Plex Sans',sans-serif;color:#1d2733;flex:none}
.stp span{flex:1;text-align:center;font:600 16px 'IBM Plex Mono',monospace;border-left:1px solid #dde1e6;border-right:1px solid #dde1e6;height:100%;display:flex;align-items:center;justify-content:center}
