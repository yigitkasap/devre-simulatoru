<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Üst çubuk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="width:100%;height:52px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:#ffffff;border-bottom:1px solid #dde1e6;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:14px">
  <div style="display:flex;align-items:center;gap:10px;padding-right:6px">
    <svg width="32" height="32" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="9" fill="#1d2733"/><path d="M8 22c3.5-10 7-10 10.5 0s7 10 10.5 0 5-8 7-6" fill="none" stroke="#f05a28" stroke-width="3.4" stroke-linecap="round"/></svg>
    <span style="font-size:15px;font-weight:600;white-space:nowrap">Devre Simülatörü</span>
  </div>
  <button aria-haspopup="menu" aria-expanded="{{dosyaOpen}}" style="display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 8px 0 10px;border-radius:8px;border:0;background:{{dosyaBg}};color:{{dosyaFg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">Dosya<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg></button>
  <button style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:0;background:{{ornBg}};color:{{ornFg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h5a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H3zM17 4h-5a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h5z"/></svg>Örnekler</button>
  <span style="width:1px;height:24px;background:#dde1e6;margin:0 6px"></span>
  <div role="group" aria-label="Araç" style="display:flex;gap:2px;padding:2px;background:#eef0f3;border-radius:10px">
    <button aria-pressed="{{secOn}}" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:0;background:{{secBg}};color:{{secFg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l10 6-4.5 1.2L13 15l-2 1-2.4-4.6L5 14z"/></svg>Seç</button>
    <button aria-pressed="{{kabOn}}" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 10px;border-radius:8px;border:0;background:{{kabBg}};color:{{kabFg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h5V5h9"/><circle cx="3" cy="15" r="1.6"/><circle cx="17" cy="5" r="1.6"/></svg>Kablo<span style="font:500 11px 'IBM Plex Mono',monospace;line-height:16px;padding:0 4px;border:1px solid #c4cad2;border-bottom-width:2px;border-radius:4px;background:#fff;color:#5f6b7a">W</span></button>
  </div>
  <span style="width:1px;height:24px;background:#dde1e6;margin:0 6px"></span>
  <button aria-label="Döndür (R)" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:transparent;color:{{selFg}};cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 8.5A6 6 0 1 0 16 13"/><path d="M16 3.5v5h-5"/></svg></button>
  <button aria-label="Ters çevir (F)" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:transparent;color:{{selFg}};cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v14"/><path d="M7 6L3 10l4 4z"/><path d="M13 6l4 4-4 4z"/></svg></button>
  <button aria-label="Seçileni sil (Delete)" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:transparent;color:{{selFg}};cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg></button>
  <span style="width:1px;height:24px;background:#dde1e6;margin:0 6px"></span>
  <button aria-label="Geri al (Ctrl+Z)" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:transparent;color:#1d2733;cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5L4 9l4 4M4 9h8a4 4 0 0 1 0 8H9"/></svg></button>
  <button aria-label="Yinele (Ctrl+Y)" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:transparent;color:#9aa3ad;cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l4 4-4 4M16 9H8a4 4 0 0 0 0 8h3"/></svg></button>
  <div style="flex:1"></div>
  <span role="status" style="display:inline-flex;align-items:center;gap:6px;color:#5f6b7a;font-size:13px;white-space:nowrap;padding-right:6px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#1b7d44" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M6.5 10l2.5 2.5 4.5-5"/></svg>Tarayıcıda kaydedildi</span>
  <div role="group" aria-label="Görünüm" style="display:flex;align-items:center;gap:0;border:1px solid #dde1e6;border-radius:9px;height:36px;box-sizing:border-box">
    <button aria-label="Uzaklaştır" style="width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#1d2733;cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10h10"/></svg></button>
    <span style="min-width:48px;text-align:center;font:500 13px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums" aria-label="Yakınlık">{{zoom}}</span>
    <button aria-label="Yakınlaştır" style="width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#1d2733;cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
    <span style="width:1px;height:20px;background:#dde1e6"></span>
    <button aria-label="Devreyi ekrana sığdır" style="width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#1d2733;cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
  </div>
  <button aria-label="Yardım ve kısayollar (?)" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:{{yardimBg}};color:#1d2733;cursor:pointer;padding:0;margin-left:4px"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.8a2.2 2.2 0 1 1 3.2 2c-.7.4-1 .9-1 1.7"/><circle cx="10" cy="14.4" r=".5" fill="currentColor"/></svg></button>
  <button aria-label="Ayarlar" aria-haspopup="dialog" style="width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:0;background:{{ayarBg}};color:{{ayarFg}};cursor:pointer;padding:0"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg></button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tool":{"editor":"enum","options":["sec","kablo"],"default":"sec"},"menu":{"editor":"enum","options":["","dosya","ornekler","ayarlar","yardim"],"default":""},"hasSel":{"editor":"boolean","default":false},"zoom":{"editor":"text","default":"%150"},"$preview":{"width":1440,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tool ?? 'sec';
    const m = this.props.menu ?? '';
    const sel = !!this.props.hasSel;
    const on = '#e6effd', onFg = '#1557c0', off = 'transparent', offFg = '#1d2733';
    return {
      secOn: t === 'sec' ? 'true' : 'false', kabOn: t === 'kablo' ? 'true' : 'false',
      secBg: t === 'sec' ? '#ffffff' : off, secFg: t === 'sec' ? onFg : offFg,
      kabBg: t === 'kablo' ? '#ffffff' : off, kabFg: t === 'kablo' ? onFg : offFg,
      dosyaBg: m === 'dosya' ? on : off, dosyaFg: m === 'dosya' ? onFg : offFg, dosyaOpen: m === 'dosya' ? 'true' : 'false',
      ornBg: m === 'ornekler' ? on : off, ornFg: m === 'ornekler' ? onFg : offFg,
      ayarBg: m === 'ayarlar' ? on : off, ayarFg: m === 'ayarlar' ? onFg : offFg,
      yardimBg: m === 'yardim' ? on : off,
      selFg: sel ? '#1d2733' : '#9aa3ad',
      zoom: this.props.zoom ?? '%150'
    };
  }
}
</script>
</body>
</html>
