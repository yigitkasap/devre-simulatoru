<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ayarlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ui{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:14px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.paper{background-color:#fbfbf9;background-image:radial-gradient(circle,#b3bac3 1.3px,transparent 1.6px),radial-gradient(circle,#d3d7dc 1px,transparent 1.3px);background-size:75px 75px,15px 15px;background-position:7px 7px,7px 7px}
.tab{height:44px;padding:0 12px;border:0;background:transparent;font:500 14px 'IBM Plex Sans',sans-serif;color:#5f6b7a;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tsel{color:#1d2733;border-bottom-color:#1d2733}
.s{fill:none;stroke:#1d2733;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb{font:600 11px 'IBM Plex Sans',sans-serif;fill:#1d2733}
.lv{font:400 10px 'IBM Plex Mono',monospace;fill:#5f6b7a}
.sec{font-size:12px;font-weight:600;color:#5f6b7a}
.sg{display:flex;background:#eef0f3;border-radius:9px;padding:2px;gap:2px}
.sg button{flex:1;height:36px;border:0;border-radius:7px;background:transparent;font:500 13px 'IBM Plex Sans',sans-serif;color:#3d4957;display:flex;align-items:center;justify-content:center;gap:6px}
.sg .on{background:#fff;color:#1d2733;font-weight:600;box-shadow:0 1px 2px rgba(29,39,51,.18)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.sw{width:36px;height:20px;border-radius:10px;position:relative;flex:none}
.sw i{position:absolute;top:2px;width:16px;height:16px;border-radius:8px;background:#fff;display:block}
</style>
</helmet>
<div class="ui" style="width:1280px;height:800px;display:flex;flex-direction:column;background:#eef0f3;overflow:hidden;position:relative">
  <dc-import name="C-UstCubuk" tool="sec" menu="ayarlar" hint-size="1280px,52px"></dc-import>
  <div style="flex:1;min-height:0;display:flex">
    <div style="width:232px;flex:none"><dc-import name="C-Kutuphane" info="direnc" hint-size="232px,748px"></dc-import></div>
    <main style="flex:1;min-width:0;display:flex;flex-direction:column">
      <div class="paper" role="application" aria-label="Devre şeması" style="flex:1;position:relative;overflow:hidden">
        <svg width="728" height="668" viewBox="0 0 728 668" style="position:absolute;left:0;top:0" aria-hidden="true">
          <g transform="translate(74,170) scale(1.5)">
            <path class="s" d="M100 40V76M100 84V120M100 40H260V60M260 100V140M260 120H340M340 174V200H260M260 180V200M260 200H100V120M180 200V210M171 210H189M174.5 214.5H185.5M178 219H182M340 120V146"/>
            <circle cx="260" cy="120" r="3.2" fill="#1d2733"/><circle cx="260" cy="200" r="3.2" fill="#1d2733"/><circle cx="180" cy="200" r="3.2" fill="#1d2733"/>
            <path class="s" d="M86 76H114"/><path d="M93 84H107" stroke="#1d2733" stroke-width="4.5"/>
            <text class="lb" x="76" y="84" text-anchor="end">B1</text><text class="lv" x="76" y="96" text-anchor="end">9 V</text>
            <rect class="s" x="254" y="60" width="12" height="40" rx="1"/>
            <text class="lb" x="274" y="78">R1</text><text class="lv" x="274" y="90">1 kΩ</text>
            <rect class="s" x="254" y="140" width="12" height="40" rx="1"/>
            <text class="lb" x="234" y="158" text-anchor="end">R2</text><text class="lv" x="234" y="170" text-anchor="end">1 kΩ</text>
            <circle class="s" cx="340" cy="160" r="14"/><text x="340" y="165" text-anchor="middle" style="font:600 13px 'IBM Plex Sans',sans-serif;fill:#1d2733">V</text>
            <text class="lb" x="360" y="158">V1</text>
          </g>
        </svg>
      </div>
      <dc-import name="C-SimCubugu" state="stop" time="0,000 s" msg="Noktalar geleneksel akım yönünü gösterir." hint-size="728px,52px"></dc-import>
    </main>
    <aside aria-label="İnceleme paneli" style="width:320px;flex:none;background:#fff;border-left:1px solid #dde1e6"><div role="tablist" style="display:flex;padding:0 8px;border-bottom:1px solid #dde1e6"><button class="tab tsel" role="tab" aria-selected="true">İncele</button><button class="tab" role="tab">Örnek</button><button class="tab" role="tab">Mesajlar</button></div></aside>
  </div>

  <div role="dialog" aria-label="Ayarlar" style="position:absolute;right:10px;top:50px;width:380px;background:#fff;border:1px solid #dde1e6;border-radius:14px;box-shadow:0 16px 40px rgba(29,39,51,.18);padding:16px 18px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">Ayarlar</b><span style="font-size:12px;color:#5f6b7a">Bu tarayıcıda saklanır</span></div>
    <section style="display:flex;flex-direction:column;gap:8px">
      <span class="sec">Direnç sembolü</span>
      <div class="sg" role="radiogroup" aria-label="Direnç sembolü">
        <button role="radio" aria-checked="false"><svg width="30" height="14" viewBox="0 0 32 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M1 7H8L9.5 3.5L12.5 10.5L15.5 3.5L18.5 10.5L21.5 3.5L23 7H31"/></svg>Zigzag</button>
        <button class="on" role="radio" aria-checked="true"><svg width="30" height="14" viewBox="0 0 32 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 7H9M23 7H31"/><rect x="9" y="3" width="14" height="8"/></svg>Kutu (IEC)</button>
      </div>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">
      <span class="sec">Kablo gerilimi renkleri</span>
      <div class="sg" role="radiogroup" aria-label="Gerilim renk ölçeği" style="flex-direction:column">
        <button class="on" role="radio" aria-checked="true" style="justify-content:space-between;padding:0 10px"><span>Klasik</span><i style="display:block;width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,#194cb3,#148f8f,#148f3d,#7a8f14,#b37319,#b31919)"></i></button>
        <button role="radio" aria-checked="false" style="justify-content:space-between;padding:0 10px"><span>Renk körlüğüne uygun</span><i style="display:block;width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,#2b56ab,#6b84b8,#7a828c,#b9762f,#c45a0a)"></i></button>
      </div>
      <label class="tg"><span>Düğüm gerilimlerini yaz<br><span style="font-size:12px;color:#5f6b7a">Her düğümün yanında küçük değer etiketi</span></span><span class="sw" style="background:#c4cad2"><i style="left:2px"></i></span></label>
    </section>
    <section style="display:flex;flex-direction:column;gap:2px">
      <span class="sec" style="margin-bottom:4px">Akım ve görünüm</span>
      <label class="tg"><span>Akım noktalarını göster</span><span class="sw" style="background:#1b7d44"><i style="right:2px"></i></span></label>
      <label class="tg"><span>Elektron akışını göster</span><span class="sw" style="background:#c4cad2"><i style="left:2px"></i></span></label>
      <label class="tg"><span>Projeksiyon kipi<br><span style="font-size:12px;color:#5f6b7a">Büyük yazı, kalın çizgi, yüksek kontrast</span></span><span class="sw" style="background:#c4cad2"><i style="left:2px"></i></span></label>
      <div class="tg"><span>Tema</span><div class="sg" style="width:200px"><button class="on">Açık</button><button>Koyu</button><button>Sistem</button></div></div>
    </section>
    <div style="display:flex;gap:8px;border-top:1px solid #eef0f3;padding-top:12px">
      <button style="height:36px;padding:0 12px;border-radius:8px;border:1px solid #c4cad2;background:#fff;font:500 13px 'IBM Plex Sans',sans-serif;color:#1d2733">İlk açılış turunu göster</button>
      <button style="height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;font:500 13px 'IBM Plex Sans',sans-serif;color:#1557c0">Kısayollar (?)</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
