<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Telefon: parça ekle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ui{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:15px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.paper{background-color:#fbfbf9;background-image:radial-gradient(circle,#b3bac3 1.2px,transparent 1.5px),radial-gradient(circle,#d3d7dc 1px,transparent 1.3px);background-size:70px 70px,14px 14px;background-position:5px 5px,5px 5px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(29,39,51,.14);display:flex;flex-direction:column}
.hd{height:22px;display:flex;align-items:center;justify-content:center}
.hd i{display:block;width:36px;height:5px;border-radius:3px;background:#c4cad2}
.ct{height:40px;padding:0 14px;border-radius:20px;border:1px solid #c4cad2;background:#fff;font:500 14px 'IBM Plex Sans',sans-serif;color:#1d2733;white-space:nowrap;flex:none}
.tl{height:84px;border-radius:12px;border:1px solid #dde1e6;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 13.5px 'IBM Plex Sans',sans-serif;color:#1d2733}
.tl svg{width:44px;height:26px}
</style>
</helmet>
<div class="ui" style="width:390px;height:844px;display:flex;flex-direction:column;background:#fff;overflow:hidden">
  <div style="height:47px;flex:none"></div>

  <div style="flex:1;position:relative;min-height:0">

        <path d="M110 60V112M110 124V180" fill="none" stroke="#1d2733" stroke-width="3" stroke-linecap="round"/>
        <path d="M86 112H134" stroke="#1d2733" stroke-width="3" stroke-linecap="round"/><path d="M97 124H123" stroke="#1d2733" stroke-width="6.5"/>
        <path d="M74 98h10M79 93v10" stroke="#1d2733" stroke-width="2" stroke-linecap="round"/>
        <text x="66" y="122" text-anchor="end" style="font:600 15px 'IBM Plex Sans',sans-serif;fill:#1d2733">B1</text>
        <text x="66" y="140" text-anchor="end" style="font:400 14px 'IBM Plex Mono',monospace;fill:#5f6b7a">9 V</text>
        <circle cx="110" cy="180" r="6" fill="#fff" stroke="#f05a28" stroke-width="2.5"/>
        <circle cx="110" cy="60" r="22" fill="#1f6feb" fill-opacity=".14"/>
        <circle cx="110" cy="60" r="8" fill="#1f6feb" stroke="#fff" stroke-width="2.5"/>

      </svg>
    </div>
    <div class="sheet" role="dialog" aria-label="Parça ekle" style="height:371px">
      <div class="hd"><i></i></div>
      <div style="padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:18px;font-weight:600">Parça ekle</h2><button aria-label="Kapat" style="width:44px;height:44px;border:0;background:transparent;color:#5f6b7a"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
      <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1">
        <div style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px 0 12px;border-radius:10px;background:#e6effd;color:#1557c0;font-size:14px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15h5V5h7"/><circle cx="4" cy="15" r="2"/></svg><span style="flex:1"><b>Zincirle ekle:</b> B1’in + ucuna bağlanır</span><button aria-label="Zincirle eklemeyi kapat" style="width:40px;height:40px;border:0;background:transparent;color:#1557c0"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
        <label style="display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid #c4cad2;border-radius:10px;box-sizing:border-box;color:#5f6b7a;flex:none">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
          <input aria-label="Parça ara" placeholder="Parça ara…" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 16px 'IBM Plex Sans',sans-serif;color:#1d2733">
        </label>
        <div role="tablist" aria-label="Kategori" style="display:flex;gap:6px;overflow:hidden;margin-right:-16px;flex:none">
          <button class="ct" role="tab" aria-selected="true" style="background:#1d2733;border-color:#1d2733;color:#fff">Sık kullanılan</button>
          <button class="ct" role="tab">Kaynaklar</button>
          <button class="ct" role="tab">Pasif</button>
          <button class="ct" role="tab">Yarı iletken</button>
          <button class="ct" role="tab">Transistör</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:hidden">
          <button class="tl" style="border:2px solid #1f6feb;background:#f3f7fe"><svg viewBox="0 0 32 20" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H8L9.5 6.5L12.5 13.5L15.5 6.5L18.5 13.5L21.5 6.5L23 10H30"/></svg>Direnç</button>
          <button class="tl"><svg viewBox="0 0 32 20" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11H11M21 11H30M21 5V17"/><path d="M11 5V17L21 11Z" fill="#1d2733"/><path d="M21 4l4-3.5M23.5 0.5h1.5V2"/></svg>LED</button>
          <button class="tl"><svg viewBox="0 0 32 20" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H13M19 10H30M13 3V17M19 3V17"/></svg>Kondansatör</button>
          <button class="tl"><svg viewBox="0 0 32 20" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M16 2V9M9 9h14M11.5 12.5h9M14 16h4"/></svg>Toprak</button>
          <button class="tl"><svg viewBox="0 0 32 20" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H9M23 10H30M13.3 6.5L16 13.5 18.7 6.5"/><circle cx="16" cy="10" r="7"/></svg>Voltmetre</button>
          <button class="tl"><svg viewBox="0 0 32 20" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H11M21 10H30M21 4V16"/><path d="M11 4V16L21 10Z" fill="#1d2733"/></svg>Diyot</button>
        </div>
      </div>
      <div style="padding:8px 16px 10px;font-size:12.5px;color:#5f6b7a;border-top:1px solid #eef0f3">Dokun: ekle · Basılı tutup sürükle: istediğin yere bırak</div>
    </div>
  </div>
  <dc-import name="C-TelAlt" bar="kur" active="parca" hint-size="390px,104px"></dc-import>
</div>

</html>
