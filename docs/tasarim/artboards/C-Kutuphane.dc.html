<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Parça kütüphanesi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:100%;height:100%;min-height:400px;box-sizing:border-box;background:#ffffff;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:14px">
<sc-if value="{{isRail}}" hint-placeholder-val="{{ false }}">
  <nav aria-label="Parça kütüphanesi" style="width:56px;height:100%;box-sizing:border-box;border-right:1px solid #dde1e6;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0">
    <button aria-label="Parça kütüphanesini aç" style="width:44px;height:44px;border-radius:10px;border:0;background:#e6effd;color:#1557c0;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><path d="M14 11v6M11 14h6"/></svg></button>
    <button aria-label="Parça ara" style="width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#1d2733;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg></button>
    <span style="width:28px;height:1px;background:#dde1e6;margin:6px 0"></span>
    <span style="font-size:10px;font-weight:600;color:#5f6b7a">Son</span>
    <button aria-label="Direnç ekle" style="width:44px;height:40px;border-radius:8px;border:0;background:transparent;color:#1d2733;cursor:pointer"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H8L9.5 6.5L12.5 13.5L15.5 6.5L18.5 13.5L21.5 6.5L23 10H30"/></svg></button>
    <button aria-label="LED ekle" style="width:44px;height:40px;border-radius:8px;border:0;background:transparent;color:#1d2733;cursor:pointer"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11H11M21 11H30M21 5V17"/><path d="M11 5V17L21 11Z" fill="currentColor"/><path d="M21 4l4-3.5M23.5 0.5h1.5V2"/></svg></button>
    <button aria-label="Pil ekle" style="width:44px;height:40px;border-radius:8px;border:0;background:transparent;color:#1d2733;cursor:pointer"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H13M19 10H30M13 3V17"/><path d="M19 6.5V13.5" stroke-width="3.2" stroke-linecap="butt"/></svg></button>
    <button aria-label="Osiloskop ekle" style="width:44px;height:40px;border-radius:8px;border:0;background:transparent;color:#1d2733;cursor:pointer"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="24" height="16" rx="2"/><path d="M8 11c1.5-5 3-5 4.5 0s3 5 4.5 0 3-5 4.5 0 1.5 2 2.5 1.5"/></svg></button>
  </nav>
</sc-if>
<sc-if value="{{isFull}}" hint-placeholder-val="{{ true }}">
  <nav aria-label="Parça kütüphanesi" style="width:100%;height:100%;box-sizing:border-box;border-right:1px solid #dde1e6;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 8px 8px 16px">
      <h2 style="margin:0;font-size:15px;font-weight:600">Parçalar</h2>
      <button aria-label="Kütüphaneyi daralt" style="width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:#5f6b7a;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5l-5 5 5 5M15 5l-5 5 5 5"/></svg></button>
    </div>
    <div style="padding:0 12px 8px">
      <label style="display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border:1px solid #c4cad2;border-radius:8px;box-sizing:border-box;color:#5f6b7a">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
        <input aria-label="Parça ara" placeholder="Parça ara…" value="{{query}}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 15px 'IBM Plex Sans',system-ui,sans-serif;color:#1d2733">
      </label>
    </div>
    <div style="flex:1;min-height:0;overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px">
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:8px 8px 4px">Kaynaklar</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.pil}};color:{{fg.pil}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H13M19 10H30M13 3V17"/><path d="M19 6.5V13.5" stroke-width="3.2" stroke-linecap="butt"/></svg>Pil</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.ac}};color:{{fg.ac}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H10M22 10H30"/><circle cx="16" cy="10" r="6"/><path d="M12.5 10c1-3 2.5-3 3.5 0s2.5 3 3.5 0"/></svg>AC kaynak</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.toprak}};color:{{fg.toprak}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M16 2V9M9 9h14M11.5 12.5h9M14 16h4"/></svg>Toprak</button>
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:10px 8px 4px">Pasif</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.direnc}};color:{{fg.direnc}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H8L9.5 6.5L12.5 13.5L15.5 6.5L18.5 13.5L21.5 6.5L23 10H30"/></svg>Direnç</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.kond}};color:{{fg.kond}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H13M19 10H30M13 3V17M19 3V17"/></svg>Kondansatör</button>
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:10px 8px 4px">Yarı iletkenler</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.diyot}};color:{{fg.diyot}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H11M21 10H30M21 4V16"/><path d="M11 4V16L21 10Z" fill="currentColor"/></svg>Diyot</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.zener}};color:{{fg.zener}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H11M21 10H30M18.5 2.5L21 4V16L23.5 17.5"/><path d="M11 4V16L21 10Z" fill="currentColor"/></svg>Zener diyot</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.led}};color:{{fg.led}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 11H11M21 11H30M21 5V17"/><path d="M11 5V17L21 11Z" fill="currentColor"/><path d="M21 4l4-3.5M23.5 0.5h1.5V2"/></svg>LED</button>
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:10px 8px 4px">Transistörler</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.npn}};color:{{fg.npn}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="10" r="8.5" stroke-width="1.1"/><path d="M2 10H12"/><path d="M13 4.5V15.5" stroke-width="2.4"/><path d="M13 7.5L20 3V0M13 12.5L20 17V20"/><path d="M20 17l-4-.4 2-2.6z" fill="currentColor"/></svg>NPN transistör</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.pnp}};color:{{fg.pnp}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="17" cy="10" r="8.5" stroke-width="1.1"/><path d="M2 10H12"/><path d="M13 4.5V15.5" stroke-width="2.4"/><path d="M13 7.5L20 3V0M13 12.5L20 17V20"/><path d="M13.5 12.8l4 .5-2.1 2.5z" fill="currentColor"/></svg>PNP transistör</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.njfet}};color:{{fg.njfet}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H12"/><path d="M12.5 10l-4-2v4z" fill="currentColor"/><path d="M13 3V17" stroke-width="2.4"/><path d="M13 5H20V0M13 15H20V20"/></svg>N kanallı JFET</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.pjfet}};color:{{fg.pjfet}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H12"/><path d="M5 10l4-2v4z" fill="currentColor"/><path d="M13 3V17" stroke-width="2.4"/><path d="M13 5H20V0M13 15H20V20"/></svg>P kanallı JFET</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.nmos}};color:{{fg.nmos}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H9M9 4V16"/><path d="M13 3V7M13 8.5V11.5M13 13V17" stroke-width="2.2"/><path d="M13 5H20V0M13 15H20V20M13 10H20V15"/><path d="M13.5 10l3.5-2v4z" fill="currentColor"/></svg>N kanallı MOSFET</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.pmos}};color:{{fg.pmos}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H9M9 4V16"/><path d="M13 3V7M13 8.5V11.5M13 13V17" stroke-width="2.2"/><path d="M13 5H20V0M13 15H20V20M13 10H20V5"/><path d="M19.5 10l-3.5-2v4z" fill="currentColor"/></svg>P kanallı MOSFET</button>
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:10px 8px 4px">Anahtarlar</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.anahtar}};color:{{fg.anahtar}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H10M22 10H30M12 9.3L21 4.5"/><circle cx="11" cy="10" r="1.3"/><circle cx="21.5" cy="10" r="1.3"/></svg>Anahtar</button>
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:10px 8px 4px">Ölçü aletleri</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.volt}};color:{{fg.volt}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H9M23 10H30M13.3 6.5L16 13.5 18.7 6.5"/><circle cx="16" cy="10" r="7"/></svg>Voltmetre</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.amper}};color:{{fg.amper}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H9M23 10H30M13.3 13.5L16 6.5 18.7 13.5M14.3 11.3h3.4"/><circle cx="16" cy="10" r="7"/></svg>Ampermetre</button>
      <div style="font-size:12px;font-weight:600;color:#5f6b7a;padding:10px 8px 4px">Laboratuvar cihazları</div>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.fg}};color:{{fg.fg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="24" height="14" rx="2"/><path d="M8 10c1.5-4 3-4 4.5 0s3 4 4.5 0 3-4 4.5 0"/></svg>Fonksiyon üreteci</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.ps}};color:{{fg.ps}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="24" height="14" rx="2"/><path d="M8.5 10h5M11 7.5v5M18.5 10h5"/></svg>DC güç kaynağı</button>
      <button style="display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border:0;border-radius:7px;background:{{bg.osc}};color:{{fg.osc}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;text-align:left;cursor:grab"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="24" height="16" rx="2"/><path d="M8 11c1.5-5 3-5 4.5 0s3 5 4.5 0 3-5 4.5 0 1.5 2 2.5 1.5"/></svg>Osiloskop</button>
    </div>
    <div aria-live="polite" style="border-top:1px solid #dde1e6;padding:12px 14px 14px;background:#f6f7f9;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:14px">{{infoName}}</b><span style="font-size:11px;color:#5f6b7a">{{infoCat}}</span></div>
      <p style="margin:0;font-size:13px;line-height:1.45;color:#3d4957">{{infoDesc}}</p>
      <span style="font-size:12px;color:#5f6b7a">Sürükleyip tuvale bırak ya da seçip tuvale tıkla.</span>
    </div>
  </nav>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["","pil","ac","toprak","direnc","kond","diyot","zener","led","npn","pnp","njfet","pjfet","nmos","pmos","anahtar","volt","amper","fg","ps","osc"],"default":""},"info":{"editor":"enum","options":["pil","ac","toprak","direnc","kond","diyot","zener","led","npn","pnp","njfet","pjfet","nmos","pmos","anahtar","volt","amper","fg","ps","osc"],"default":"direnc"},"query":{"editor":"text","default":""},"rail":{"editor":"boolean","default":false},"$preview":{"width":256,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    const keys = ['pil','ac','toprak','direnc','kond','diyot','zener','led','npn','pnp','njfet','pjfet','nmos','pmos','anahtar','volt','amper','fg','ps','osc'];
    const a = this.props.active ?? '';
    const bg = {}, fg = {};
    keys.forEach((k) => { bg[k] = k === a ? '#e6effd' : 'transparent'; fg[k] = k === a ? '#1557c0' : '#1d2733'; });
    const D = {
      pil: ['Pil', 'Kaynaklar', 'Uçları arasında sabit bir gerilim tutan doğru akım kaynağı; iç direnci ayarlanabilir.'],
      ac: ['AC kaynak', 'Kaynaklar', 'Yönü zamanla değişen gerilim üreten alternatif akım kaynağı: sinüs, kare ya da üçgen dalga; tepe gerilimi ve frekansı ayarlanır.'],
      toprak: ['Toprak', 'Kaynaklar', 'Devrenin 0 V referans noktası; her devrede en az bir tane olmalı.'],
      direnc: ['Direnç', 'Pasif', 'Üzerinden geçen akımla orantılı bir gerilim düşümü oluşturur: V = I · R.'],
      kond: ['Kondansatör', 'Pasif', 'Yük depolar; bir direnç üzerinden zamanla dolar ya da boşalır.'],
      diyot: ['Diyot', 'Yarı iletkenler', 'Akımı yalnızca bir yönde, anottan katoda geçirir; ileri yönde yaklaşık 0,6-0,7 V düşürür.'],
      zener: ['Zener diyot', 'Yarı iletkenler', 'Ters yönde, kırılma (zener) geriliminde iletime geçen diyot; gerilimi sınırlamak ve kırpmak için kullanılır.'],
      led: ['LED', 'Yarı iletkenler', 'Işık yayan diyot; fazla akım geçerse yanar, bu yüzden seri bir ön direnç gerekir.'],
      npn: ['NPN transistör', 'Transistörler', 'Küçük bir baz akımıyla büyük kollektör akımını kontrol eder (IC = β · IB); yükselteç ve anahtar olarak kullanılır.'],
      pnp: ['PNP transistör', 'Transistörler', 'NPN’in ters kutuplusu: akım emetörden girer, kollektörden çıkar; baz emetörden düşük gerilimde olunca iletir.'],
      njfet: ['N kanallı JFET', 'Transistörler', 'Drain akımını kapı-kaynak gerilimi (VGS) kontrol eder; kapı neredeyse akım çekmez. VGS = 0’da en büyük akım (IDSS) akar.'],
      pjfet: ['P kanallı JFET', 'Transistörler', 'N kanallı JFET’in ters kutuplusu: kapıya pozitif gerilim verildikçe akım azalır.'],
      nmos: ['N kanallı MOSFET', 'Transistörler', 'Kapısı yalıtılmış alan etkili transistör; VGS eşik gerilimini (VT) aşınca iletime geçer. Anahtar ve yükselteç olarak kullanılır.'],
      pmos: ['P kanallı MOSFET', 'Transistörler', 'P kanallı MOSFET: kapı kaynaktan yeterince düşük olunca (VGS < VT < 0) iletime geçer.'],
      anahtar: ['Anahtar', 'Anahtarlar', 'Devreyi açar ya da kapatır; simülasyon sırasında üzerine tıklayarak değiştirilir.'],
      volt: ['Voltmetre', 'Ölçü aletleri', 'İki nokta arasındaki gerilimi ölçer; ölçülen parçaya paralel bağlanır.'],
      amper: ['Ampermetre', 'Ölçü aletleri', 'İçinden geçen akımı ölçer; devreye seri bağlanır.'],
      fg: ['Fonksiyon üreteci', 'Laboratuvar cihazları', 'Laboratuvardaki fonksiyon üreteci (GFG-8015G benzeri): sinüs, kare, üçgen; 0,2 Hz – 2 MHz, genlik, DC offset, simetri, −20 dB, 50 Ω çıkış, TTL darbe çıkışı. COM ucu şebeke toprağına bağlıdır.'],
      ps: ['DC güç kaynağı', 'Laboratuvar cihazları', 'İki çıkışlı laboratuvar DC güç kaynağı: her çıkışın gerilimi (0–30 V) ve akım sınırı ayarlanır; çıkışlar topraktan yalıtılmıştır, seri bağlanabilir.'],
      osc: ['Osiloskop', 'Laboratuvar cihazları', 'Gerilimin zamanla nasıl değiştiğini çizer; iki kanal (A, B) ortak uca göre, DC/AC/GND kuplaj, ADD, INV ve X-Y. Girişi 1 MΩ, COM ucu şebeke toprağına bağlıdır.']
    };
    const inf = D[this.props.info ?? 'direnc'] || D.direnc;
    return {
      bg, fg,
      infoName: inf[0], infoCat: inf[1], infoDesc: inf[2],
      query: this.props.query ?? '',
      isRail: !!this.props.rail, isFull: !this.props.rail
    };
  }
}
