<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tablet 1024</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ui{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:15px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.paper{background-color:#fbfbf9;background-image:radial-gradient(circle,#b3bac3 1.2px,transparent 1.5px),radial-gradient(circle,#d3d7dc 1px,transparent 1.3px);background-size:65px 65px,13px 13px;background-position:6px 6px,6px 6px}
.ib{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:#1d2733;display:flex;align-items:center;justify-content:center;flex:none}
.tb{height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;font:500 15px 'IBM Plex Sans',sans-serif;color:#1d2733;display:flex;align-items:center;gap:6px}
.tab{height:48px;padding:0 12px;border:0;background:transparent;font:500 15px 'IBM Plex Sans',sans-serif;color:#5f6b7a;border-bottom:2px solid transparent}
.tsel{color:#1d2733;border-bottom-color:#1d2733}
.s{fill:none;stroke:#1d2733;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #eef0f3}
.rd b{font:500 17px 'IBM Plex Mono',monospace}
</style>
</helmet>
<div class="ui" style="width:1024px;height:768px;display:flex;flex-direction:column;background:#eef0f3;overflow:hidden">
  <header style="height:24px;flex:none;background:#fff"></header>
  <header style="height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;background:#fff;border-bottom:1px solid #dde1e6">
    <svg width="32" height="32" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="9" fill="#1d2733"/><path d="M8 22c3.5-10 7-10 10.5 0s7 10 10.5 0 5-8 7-6" fill="none" stroke="#f05a28" stroke-width="3.4" stroke-linecap="round"/></svg>
    <button class="tb" style="font-weight:600">LED ve ön direnç ▾</button>
    <button class="tb"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h5a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H3zM17 4h-5a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h5z"/></svg>Örnekler</button>
    <span style="width:1px;height:28px;background:#dde1e6;margin:0 6px"></span>
    <button class="ib" aria-label="Geri al"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5L4 9l4 4M4 9h8a4 4 0 0 1 0 8H9"/></svg></button>
    <button class="ib" aria-label="Yinele" style="color:#9aa3ad"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5l4 4-4 4M16 9H8a4 4 0 0 0 0 8h3"/></svg></button>
    <span style="flex:1"></span>
    <span style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:#e8f5ed;color:#14613a;font:600 13px 'IBM Plex Sans',sans-serif"><i style="display:block;width:8px;height:8px;border-radius:4px;background:#1b7d44"></i>Ölç · <span class="mono" style="font-weight:500">1,594 s</span></span>
    <button class="ib" aria-label="Devreyi ekrana sığdır"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
    <button class="ib" aria-label="Yardım"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.8a2.2 2.2 0 1 1 3.2 2c-.7.4-1 .9-1 1.7"/><circle cx="10" cy="14.4" r=".5" fill="currentColor"/></svg></button>
    <button class="ib" aria-label="Ayarlar"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg></button>
  </header>
  <div style="flex:1;min-height:0;display:flex">
    <nav aria-label="Araçlar" style="width:72px;flex:none;background:#fff;border-right:1px solid #dde1e6;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0">
      <button style="width:60px;height:60px;border:0;border-radius:12px;background:transparent;color:#9aa3ad;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11.5px 'IBM Plex Sans',sans-serif"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>Parça</button>
      <button style="width:60px;height:60px;border:0;border-radius:12px;background:transparent;color:#9aa3ad;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11.5px 'IBM Plex Sans',sans-serif"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15h5V5h7"/><circle cx="4" cy="15" r="2"/><circle cx="16" cy="5" r="2"/></svg>Bağla</button>
      <span style="font-size:10.5px;color:#5f6b7a;text-align:center;padding:4px 6px;line-height:1.3">Ölç’te kapalı</span>
    </nav>
    <main style="flex:1;min-width:0;display:flex;flex-direction:column">
      <div class="paper" role="application" aria-label="Devre şeması, Ölç kipi" style="flex:1;position:relative;overflow:hidden;box-shadow:inset 0 3px 0 #1b7d44">
        <svg width="632" height="604" viewBox="0 0 632 604" aria-hidden="true" style="position:absolute;inset:0">
          <defs><radialGradient id="t1"><stop offset="0" stop-color="#ff4d4d" stop-opacity=".55"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/></radialGradient></defs>
          <g transform="translate(-30,90) scale(1.12)">
            <circle cx="480" cy="205" r="64" fill="url(#t1)"/>
            <rect x="230" y="96" width="140" height="74" rx="6" fill="none" stroke="#1f6feb" stroke-width="2.4"/>
            <path d="M180 204V150H270" fill="none" stroke="#b31919" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M270 150L275 139.5L285 160.5L295 139.5L305 160.5L315 139.5L325 160.5L330 150" fill="none" stroke="#8a4a16" stroke-width="3.6" stroke-linejoin="round"/>
            <path d="M330 150H480V192" fill="none" stroke="#548f14" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M480 222V330H381M339 330H180V216M180 330V360M166 360H194M171 367H189M176 374H184" fill="none" stroke="#148f3d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="s" d="M159 204H201"/><path d="M169 216H191" fill="none" stroke="#1d2733" stroke-width="6.5"/>
            <path d="M458 192H502L480 222Z" fill="#ff4d4d" stroke="#1d2733" stroke-width="2.5" stroke-linejoin="round"/><path class="s" d="M458 222H502"/>
            <circle cx="360" cy="330" r="21" fill="#fbfbf9" stroke="#1d2733" stroke-width="3"/>
            <text x="360" y="337" text-anchor="middle" style="font:600 20px 'IBM Plex Sans',sans-serif;fill:#1d2733">A</text>
            <rect x="314" y="360" width="92" height="28" rx="5" fill="#1e2a25"/><text x="360" y="380" text-anchor="middle" style="font:600 16px 'IBM Plex Mono',monospace;fill:#a6f4bd">14,45 mA</text>
            <text x="146" y="214" text-anchor="end" style="font:600 16px 'IBM Plex Sans',sans-serif;fill:#1d2733">B1</text>
            <text x="300" y="118" text-anchor="middle" style="font:600 16px 'IBM Plex Sans',sans-serif;fill:#1557c0">R1</text>
            <text x="534" y="214" style="font:600 16px 'IBM Plex Sans',sans-serif;fill:#1d2733">D1</text>
            <g fill="#ffd43b" stroke="#7a5c00" stroke-width="1.2"><circle cx="214" cy="150" r="4"/><circle cx="300" cy="150" r="4"/><circle cx="388" cy="150" r="4"/><circle cx="460" cy="150" r="4"/><circle cx="480" cy="270" r="4"/><circle cx="430" cy="330" r="4"/><circle cx="284" cy="330" r="4"/><circle cx="212" cy="330" r="4"/><circle cx="180" cy="270" r="4"/></g>
          </g>
        </svg>
        <button style="position:absolute;left:12px;bottom:12px;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:22px;border:1px solid #dde1e6;background:rgba(255,255,255,.95);font:500 13px 'IBM Plex Sans',sans-serif;color:#1d2733"><i style="display:block;width:64px;height:8px;border-radius:4px;background:linear-gradient(90deg,#194cb3,#148f8f,#148f3d,#7a8f14,#b37319,#b31919)"></i><span class="mono" style="font-size:12px">±5 V</span></button>
      </div>
      <div style="height:64px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-top:1.5px solid #1b7d44">
        <button class="tb" style="border:1px solid #c4cad2"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></svg>Durdur</button>
        <button class="tb" style="border:1px solid #c4cad2"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="11" r="7"/><path d="M10 11l4-3M10 4V2"/></svg>Hız <b class="mono" style="font-size:14px">×1</b></button>
        <span style="flex:1;font-size:13px;color:#5f6b7a">Noktalar geleneksel akım yönünü gösterir.</span>
        <button aria-label="Duraklat" style="width:56px;height:56px;border-radius:28px;border:0;background:#1d2733;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(29,39,51,.22)"><svg width="24" height="24" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="11.6" y="4" width="3.4" height="12" rx="1" fill="currentColor"/></svg></button>
      </div>
    </main>
    <aside aria-label="İnceleme paneli" style="width:320px;flex:none;background:#fff;border-left:1px solid #dde1e6;display:flex;flex-direction:column">
      <div role="tablist" style="display:flex;padding:0 8px;border-bottom:1px solid #dde1e6"><button class="tab tsel" role="tab" aria-selected="true">İncele</button><button class="tab" role="tab">Cihazlar</button><button class="tab" role="tab">Mesajlar</button></div>
      <div style="padding:16px 18px;display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:20px">R1</b><span style="color:#5f6b7a;font-size:14px">Direnç · canlı</span></div>
        <div class="rd"><span>Gerilim</span><b>3,180 V</b></div>
        <div class="rd"><span>Akım</span><b>14,45 mA</b></div>
        <div class="rd"><span>Harcanan güç</span><b>45,95 mW</b></div>
        <div style="background:#eef3f8;border:1px solid #d6e2ee;border-radius:10px;padding:10px 12px;margin-top:6px"><span class="mono" style="font-size:13.5px">V = I · R → 3,18 V = 14,45 mA × 220 Ω</span></div>
        <span style="font-size:13px;font-weight:600;color:#5f6b7a;margin-top:10px">Direnç</span>
        <div style="display:flex;gap:6px"><button style="width:48px;height:48px;border-radius:10px;border:1px solid #c4cad2;background:#f6f7f9;font:600 20px 'IBM Plex Sans',sans-serif">−</button><div style="flex:1;height:48px;border:1px solid #c4cad2;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:500 17px 'IBM Plex Mono',monospace">220<span style="color:#5f6b7a">Ω</span></div><button style="width:48px;height:48px;border-radius:10px;border:1px solid #c4cad2;background:#f6f7f9;font:600 20px 'IBM Plex Sans',sans-serif">+</button></div>
        <span style="font-size:12.5px;color:#1b7d44">Canlı uygulanır · simülasyon durmaz</span>
      </div>
    </aside>
  </div>
</div>
</x-dc>
