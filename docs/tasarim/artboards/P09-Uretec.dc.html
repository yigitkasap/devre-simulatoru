.lbl small{font:500 11px 'IBM Plex Mono',monospace;color:#5f6b7a}
.wf{flex:1;height:52px;border-radius:10px;border:1px solid #9aa3ad;background:#f7f8fa;box-shadow:0 2px 0 #9aa3ad;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 11.5px 'IBM Plex Sans',sans-serif;color:#1d2733}
.sw{width:44px;height:26px;border-radius:13px;position:relative;flex:none}
.sw i{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#fff;display:block}
