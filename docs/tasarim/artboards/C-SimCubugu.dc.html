<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Simülasyon çubuğu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div role="region" aria-label="Simülasyon" style="width:100%;height:52px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 12px;background:#ffffff;border-top:1px solid #dde1e6;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:14px">
  <button aria-pressed="{{runPressed}}" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 12px;border-radius:8px;border:1px solid {{playBg}};background:{{playBg}};color:#ffffff;font:600 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>Oynat</button>
  <button style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #c4cad2;background:#ffffff;color:{{pauseFg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.2" height="12" rx="1" fill="currentColor"/><rect x="11.8" y="4" width="3.2" height="12" rx="1" fill="currentColor"/></svg>Duraklat</button>
  <button title="Durdur: LED’ler onarılır, kondansatörler başlangıç gerilimine döner" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid #c4cad2;background:#ffffff;color:{{stopFg}};font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5" fill="currentColor"/></svg>Durdur</button>
  <span style="width:1px;height:24px;background:#dde1e6;margin:0 4px"></span>
  <span role="status" style="display:inline-flex;align-items:center;gap:8px;font-weight:600;min-width:118px">
    <sc-if value="{{isRun}}" hint-placeholder-val="{{ true }}"><i style="display:block;width:10px;height:10px;border-radius:5px;background:#1b7d44"></i></sc-if>
    <sc-if value="{{isPause}}" hint-placeholder-val="{{ false }}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="0" width="3" height="10" fill="#e8a317"/><rect x="6" y="0" width="3" height="10" fill="#e8a317"/></svg></sc-if>
    <sc-if value="{{isStop}}" hint-placeholder-val="{{ false }}"><i style="display:block;width:10px;height:10px;background:#9aa3ad"></i></sc-if>
    {{statusText}}
  </span>
  <span style="font-size:13px;color:#5f6b7a;white-space:nowrap">Zaman: <span style="font:600 13px 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:#1d2733">{{time}}</span></span>
  <button aria-haspopup="dialog" style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;border:1px solid #c4cad2;background:{{speedBg}};color:#1d2733;font:500 14px 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;white-space:nowrap"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="11" r="7"/><path d="M10 11l4-3M10 4V2"/></svg>Hız <span style="font:600 13px 'IBM Plex Mono',monospace">{{speed}}</span><span style="color:#5f6b7a;font-size:13px">{{speedNote}}</span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5-5 5 5"/></svg></button>
  <label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;cursor:pointer;padding:0 4px">
    <span style="width:18px;height:18px;box-sizing:border-box;border-radius:5px;border:1.5px solid {{elBorder}};background:{{elBg}};display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Elektron akışını göster
  </label>
  <div style="flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;color:{{msgFg}}">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5"/><circle cx="10" cy="6.3" r=".5" fill="currentColor"/></svg>
    <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{msg}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["stop","run","pause"],"default":"stop"},"time":{"editor":"text","default":"0,000 s"},"speed":{"editor":"text","default":"×1"},"speedNote":{"editor":"text","default":"gerçek zaman"},"msg":{"editor":"text","default":"Noktalar geleneksel akım yönünü gösterir: dış devrede + uçtan − uca."},"err":{"editor":"boolean","default":false},"electron":{"editor":"boolean","default":false},"speedOpen":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'stop';
    const el = !!this.props.electron;
    return {
      isRun: s === 'run', isPause: s === 'pause', isStop: s === 'stop',
      statusText: s === 'run' ? 'Çalışıyor' : s === 'pause' ? 'Duraklatıldı' : 'Durduruldu',
      runPressed: s === 'run' ? 'true' : 'false',
      playBg: s === 'run' ? '#14613a' : '#1b7d44',
      pauseFg: s === 'run' ? '#1d2733' : '#9aa3ad',
      stopFg: s === 'stop' ? '#9aa3ad' : '#1d2733',
      time: this.props.time ?? '0,000 s',
      speed: this.props.speed ?? '×1',
      speedNote: this.props.speedNote ?? 'gerçek zaman',
      speedBg: this.props.speedOpen ? '#e6effd' : '#ffffff',
      elBg: el ? '#1f6feb' : '#ffffff', elBorder: el ? '#1f6feb' : '#c4cad2',
      msg: this.props.msg ?? 'Noktalar geleneksel akım yönünü gösterir: dış devrede + uçtan − uca.',
      msgFg: this.props.err ? '#d92d20' : '#5f6b7a'
    };
  }
}
</script>
</body>
</html>
