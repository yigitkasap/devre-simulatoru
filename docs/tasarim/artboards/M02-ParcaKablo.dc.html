<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Parça ekleme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ui{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d2733;font-size:14px;line-height:1.45}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.paper{background-color:#fbfbf9;background-image:radial-gradient(circle,#b3bac3 1.3px,transparent 1.6px),radial-gradient(circle,#d3d7dc 1px,transparent 1.3px);background-size:75px 75px,15px 15px;background-position:7px 7px,7px 7px}
.tab{height:44px;padding:0 12px;border:0;background:transparent;font:500 14px 'IBM Plex Sans',sans-serif;color:#5f6b7a;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tsel{color:#1d2733;border-bottom-color:#1d2733}
.k{font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:18px;padding:0 5px;border:1px solid #c4cad2;border-bottom-width:2px;border-radius:4px;background:#fff;color:#1d2733}
.s{fill:none;stroke:#1d2733;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.w{fill:none;stroke:#1d2733;stroke-width:3;stroke-linecap:round}
.p{fill:#fff;stroke:#f05a28;stroke-width:2.2}
.lb{font:600 16px 'IBM Plex Sans',sans-serif;fill:#1d2733}
.lv{font:400 15px 'IBM Plex Mono',monospace;fill:#5f6b7a}
.row{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border-radius:8px}
</style>
</helmet>
<div class="ui" style="width:1440px;height:900px;display:flex;flex-direction:column;background:#eef0f3;overflow:hidden">
  <dc-import name="C-UstCubuk" tool="sec" hint-size="1440px,52px"></dc-import>
  <div style="flex:1;min-height:0;display:flex">
    <div style="width:256px;flex:none"><dc-import name="C-Kutuphane" active="led" info="led" hint-size="256px,848px"></dc-import></div>
    <main style="flex:1;min-width:0;display:flex;flex-direction:column">
      <div class="paper" role="application" aria-label="Devre şeması" style="flex:1;position:relative;overflow:hidden">
        <svg width="848" height="768" viewBox="0 0 848 768" style="position:absolute;left:0;top:0" aria-hidden="true">
          <g transform="translate(150,170)">
            <path class="w" d="M180 150H240"/>
            <path class="s" d="M180 150V204M180 216V270"/>
            <path class="s" d="M159 204H201"/>
            <path d="M169 216H191" fill="none" stroke="#1d2733" stroke-width="6.5"/>
            <path class="s" style="stroke-width:2" d="M152 186h9M156.5 181.5v9"/>
            <text class="lb" x="140" y="208" text-anchor="end">B1</text>
            <text class="lv" x="140" y="228" text-anchor="end">5 V</text>
            <path class="s" d="M240 150H270L275 139.5L285 160.5L295 139.5L305 160.5L315 139.5L325 160.5L330 150H360"/>
            <text class="lb" x="300" y="118" text-anchor="middle">R1</text>
            <text class="lv" x="300" y="136" text-anchor="middle">220 Ω</text>
            <circle class="p" cx="180" cy="270" r="4.5"/>
            <circle class="p" cx="360" cy="150" r="4.5"/>
            <g opacity=".6">
              <rect x="445" y="135" width="70" height="150" rx="6" fill="#e6effd" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="6 5"/>
              <path d="M480 150V192M480 222V270M458 222H502" fill="none" stroke="#1f6feb" stroke-width="3" stroke-linecap="round"/>
              <path d="M458 192H502L480 222Z" fill="#1f6feb"/>
              <path d="M505 186l13-13M512 173h6v6M510 202l13-13M517 189h6v6" fill="none" stroke="#1f6feb" stroke-width="2.4" stroke-linecap="round"/>
              <circle cx="480" cy="150" r="4" fill="#1f6feb"/><circle cx="480" cy="270" r="4" fill="#1f6feb"/>
            </g>
            <path d="M480 150h-6m12 0h6M480 144v-6m0 12v6" stroke="#1f6feb" stroke-width="1.5"/>
            <path d="M500 250l12 26 4-10 10-2z" fill="#1d2733" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
          </g>
        </svg>
        <div style="position:absolute;left:688px;top:370px;background:#1d2733;color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 12px rgba(29,39,51,.2)">
          <b style="font-size:13px">LED · D1</b>
          <span style="opacity:.85">Bırak: yerleştir · <span class="k" style="background:#2c3846;color:#fff;border-color:#475466">R</span> döndür</span>
        </div>
      </div>
      <div style="height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#f6f7f9;border-top:1px solid #dde1e6;font-size:13px;color:#5f6b7a">
        <span><b style="color:#1d2733">LED:</b> yerleştirmek için tuvale bırak ya da tıkla · <span class="k">R</span> döndür · <span class="k">F</span> ters çevir · <span class="k">Shift</span> + tıkla: birden çok · <span class="k">Esc</span> iptal</span>
        <span>Tüm kısayollar: <span class="k">?</span></span>
      </div>
      <dc-import name="C-SimCubugu" state="stop" time="0,000 s" msg="Noktalar geleneksel akım yönünü gösterir: dış devrede + uçtan − uca." hint-size="848px,52px"></dc-import>
    </main>
    <aside aria-label="İnceleme paneli" style="width:336px;flex:none;background:#fff;border-left:1px solid #dde1e6;display:flex;flex-direction:column">
      <div role="tablist" style="display:flex;padding:0 8px;border-bottom:1px solid #dde1e6">
        <button class="tab tsel" role="tab" aria-selected="true">İncele</button>
        <button class="tab" role="tab" aria-selected="false">Örnek</button>
        <button class="tab" role="tab" aria-selected="false">Mesajlar <span class="mono" style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:10px;background:#fef6e7;color:#b54708">2</span></button>
      </div>
      <div style="padding:16px 12px;display:flex;flex-direction:column;gap:14px">
        <div style="padding:0 8px;display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">Devre</b><span style="font-size:13px;color:#5f6b7a">2 parça · 1 kablo</span></div>
        <button style="margin:0 8px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid #f3d9a8;background:#fef6e7;text-align:left;font:400 13px 'IBM Plex Sans',sans-serif;color:#1d2733">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" style="flex:none"><path d="M10 1.5l9 16H1z" fill="#e8a317" stroke="#b54708" stroke-width="1" stroke-linejoin="round"/><path d="M10 7v4.5" stroke="#1d2733" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1.1" fill="#1d2733"/></svg>
          <span><b>2 boşta uç</b> · devre henüz kapalı değil. Göster</span>
        </button>
        <div style="display:flex;flex-direction:column">
          <span style="font-size:12px;font-weight:600;color:#5f6b7a;padding:0 10px 6px">Parçalar</span>
          <button class="row" style="border:0;background:transparent;font:500 14px 'IBM Plex Sans',sans-serif;color:#1d2733;text-align:left"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 10H13M19 10H30M13 3V17"/><path d="M19 6.5V13.5" stroke-width="3.2" stroke-linecap="butt"/></svg><span style="flex:1">B1 <span style="color:#5f6b7a;font-weight:400">· Pil</span></span><span class="mono" style="color:#5f6b7a">5 V</span></button>
          <button class="row" style="border:0;background:transparent;font:500 14px 'IBM Plex Sans',sans-serif;color:#1d2733;text-align:left"><svg width="32" height="20" viewBox="0 0 32 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10H8L9.5 6.5L12.5 13.5L15.5 6.5L18.5 13.5L21.5 6.5L23 10H30"/></svg><span style="flex:1">R1 <span style="color:#5f6b7a;font-weight:400">· Direnç</span></span><span class="mono" style="color:#5f6b7a">220 Ω</span></button>
        </div>
        <div style="margin:0 8px;padding:12px;border-radius:10px;background:#f6f7f9;font-size:13px;color:#5f6b7a">Oynat’a basınca ölçü aletlerinin göstergeleri bu listenin başında büyük yazıyla toplanır.</div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
